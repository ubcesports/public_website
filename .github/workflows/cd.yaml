name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEBSITE_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ env.WEBSITE_IMAGE }}:${{ steps.meta.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy SHA
        id: meta
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push website
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.WEBSITE_IMAGE }}:latest
            ${{ env.WEBSITE_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ubcesports.ca

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose template
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p '${VPS_DEPLOY_PATH}'"
          cat deploy/compose.yaml | ssh "${VPS_USER}@${VPS_HOST}" "cat > '${VPS_DEPLOY_PATH}/compose.yaml.template'"

      - name: Pull image and restart website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          WEBSITE_IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            WEBSITE_IMAGE="${WEBSITE_IMAGE}" \
            VPS_DEPLOY_PATH="${VPS_DEPLOY_PATH}" \
            bash -s <<'EOF'
          set -euo pipefail

          cd "${VPS_DEPLOY_PATH}"

          export WEBSITE_IMAGE
          sed \
            -e "s|\${WEBSITE_IMAGE}|${WEBSITE_IMAGE}|g" \
            compose.yaml.template > compose.yaml

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF
